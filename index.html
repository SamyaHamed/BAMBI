<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Bambi Women's Fashion</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:ital,wght@0,400..900;1,400..900&family=Cairo:wght@400;600&display=swap" rel="stylesheet">
  <style>
    body {
      font-family: 'Cairo', sans-serif;
      background: #fadcda;
      color: #5a3d3f;
      margin: 0;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      height: 100vh;
      overflow: hidden;
    }

    header {
      margin-bottom: 20px;
      animation: fadeInDown 1s ease;
      text-align: center;
    }

    .brand-logo {
      width: 115px;
      margin: 0 auto 10px;
    }

    .brand-logo img {
      width: 100%;
      height: auto;
      display: block;
    }

    .brand-wordmark {
      width: min(70vw, 340px);
      display: block;
      margin: 0 auto;
    }

    .links {
      display: flex;
      flex-direction: column;
      gap: 15px;
      width: 250px;
    }

    .link-btn {
      padding: 14px;
      border-radius: 30px;
      text-decoration: none;
      font-size: 18px;
      font-weight: bold;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      transition: all 0.3s ease;
      opacity: 0;
      transform: translateY(20px);
      animation: fadeInUp 0.7s forwards;
    }

    /* Social media colors */
    .facebook { background: #1877f2; color: white; animation-delay: 0.2s; }
    .instagram { background: linear-gradient(45deg,#f6c453,#d46a9c,#8b5fbf); color: white; animation-delay: 0.4s; }
    .whatsapp { background: #25d366; color: white; animation-delay: 0.6s; }

    .link-btn:hover {
      transform: scale(1.08);
      box-shadow: 0 6px 12px rgba(0,0,0,0.2);
    }

    /* Animations */
    @keyframes fadeInUp {
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    @keyframes fadeInDown {
      from {
        opacity: 0;
        transform: translateY(-30px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }
  </style>
</head>
<body>
  <header>
    <div class="brand-logo">
      <img src="assets/logo-icon.png" alt="Bambi logo">
    </div>
    <img class="brand-wordmark" src="assets/wordmark.png" alt="Bambi Women's Fashion">
  </header>

  <div class="links">
    <a class="link-btn facebook" href="https://www.facebook.com/share/161KSmJWcKp/?mibextid=wwXIfr" target="_blank"><i class="fab fa-facebook"></i> Facebook</a>
    <a class="link-btn instagram" href="https://www.instagram.com/bambi_fashion26?igsh=aG4wemJ4enp4dGUx&utm_source=qr" target="_blank"><i class="fab fa-instagram"></i> Instagram</a>
    <a class="link-btn whatsapp" href="https://wa.me/972599776578" target="_blank"><i class="fab fa-whatsapp"></i> WhatsApp</a>
  </div>
</body>
</html>
