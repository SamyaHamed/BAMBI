<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Bambi Women's Fashion</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    body {
      font-family: 'Cairo', sans-serif;
      background: linear-gradient(135deg, #f7e3e2, #f0d0ce);
      color: #5a3d3f;
      margin: 0;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      height: 100vh;
      overflow: hidden;
    }

    header {
      margin-bottom: 20px;
      animation: fadeInDown 1s ease;
      text-align: center;
    }

    .brand-name {
      margin: 0;
      font-size: 44px;
      font-weight: 700;
      letter-spacing: 10px;
      color: #b8747a;
      text-shadow: 0 2px 6px rgba(184, 116, 122, 0.3);
    }

    .brand-divider {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      margin: 8px 0;
      color: #b8747a;
    }

    .brand-divider span {
      width: 40px;
      height: 1px;
      background: #b8747a;
    }

    .brand-sub {
      margin: 0;
      font-size: 13px;
      letter-spacing: 4px;
      color: #9c5b61;
    }

    .links {
      display: flex;
      flex-direction: column;
      gap: 15px;
      width: 250px;
    }

    .link-btn {
      padding: 14px;
      border-radius: 30px;
      text-decoration: none;
      font-size: 18px;
      font-weight: bold;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      transition: all 0.3s ease;
      opacity: 0;
      transform: translateY(20px);
      animation: fadeInUp 0.7s forwards;
    }

    /* Social media colors */
    .facebook { background: #1877f2; color: white; animation-delay: 0.2s; }
    .instagram { background: linear-gradient(45deg,#f6c453,#d46a9c,#8b5fbf); color: white; animation-delay: 0.4s; }
    .whatsapp { background: #25d366; color: white; animation-delay: 0.6s; }

    .link-btn:hover {
      transform: scale(1.08);
      box-shadow: 0 6px 12px rgba(0,0,0,0.2);
    }

    /* Animations */
    @keyframes fadeInUp {
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    @keyframes fadeInDown {
      from {
        opacity: 0;
        transform: translateY(-30px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }
  </style>
</head>
<body>
  <header>
    <h1 class="brand-name">BAMBI</h1>
    <div class="brand-divider"><span></span><i class="fa-solid fa-heart"></i><span></span></div>
    <p class="brand-sub">WOMEN'S FASHION</p>
  </header>

  <div class="links">
    <a class="link-btn facebook" href="https://www.facebook.com/share/161KSmJWcKp/?mibextid=wwXIfr" target="_blank"><i class="fab fa-facebook"></i> Facebook</a>
    <a class="link-btn instagram" href="https://www.instagram.com/bambi_fashion26?igsh=aG4wemJ4enp4dGUx&utm_source=qr" target="_blank"><i class="fab fa-instagram"></i> Instagram</a>
    <a class="link-btn whatsapp" href="https://wa.me/970000000000" target="_blank"><i class="fab fa-whatsapp"></i> WhatsApp</a>
  </div>
</body>
</html>
